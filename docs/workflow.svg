<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a5a"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2552d"/>
    </marker>
    <style>
      .t{font-size:17px;font-weight:700;fill:#1f1b24}
      .s{font-size:13px;fill:#3d3946}
      .m{font-size:12px;fill:#6b6675}
      .h{font-size:22px;font-weight:700;fill:#1f1b24}
      .tag{font-size:11px;font-weight:700;letter-spacing:1px}
      .ln{stroke:#4a4a5a;stroke-width:2;fill:none}
      .opt{font-size:11px;font-weight:700;fill:#c2552d}
    </style>
  </defs>
  <rect width="1200" height="1240" fill="#faf8f5"/>
  <text x="40" y="44" class="h">Chameleon engine: end-to-end workflow</text>
  <text x="40" y="68" class="m">Left: what runs in the scoring container (offline, ~1 s/design, deterministic by default). Right: what AI did at development time.</text>

  <!-- ===== runtime column ===== -->
  <rect x="30" y="88" width="770" height="1135" rx="14" fill="#ffffff" stroke="#d9d3cb"/>
  <text x="50" y="114" class="tag" fill="#2f6f5e">RUNTIME · IN THE CONTAINER · EVERY STEP LOGGED TO THE HTML TRACE</text>

  <!-- input -->
  <rect x="60" y="130" width="710" height="56" rx="10" fill="#eef1f6" stroke="#9aa6bd"/>
  <text x="80" y="154" class="t">Input</text>
  <text x="80" y="175" class="s">source design JSON (no semantic labels; junk-tolerant) + target canvas size</text>
  <line x1="415" y1="186" x2="415" y2="208" class="ln" marker-end="url(#a)"/>

  <!-- 1 analyze -->
  <rect x="60" y="210" width="710" height="172" rx="10" fill="#f3efe8" stroke="#b9ab95"/>
  <text x="80" y="236" class="t">1 · Analyze</text>
  <text x="560" y="236" class="m">engine/analyze.py · relations.py</text>
  <text x="80" y="260" class="s">• Background, decorations; units that move together: groups, panels, product clusters,</text>
  <text x="92" y="278" class="s">stickers pinned to cards, shadows/discs pinned to products, corner ribbons</text>
  <text x="80" y="300" class="s">• Roles from geometry + style (headline, hero, logo, call to action, badges, legal, …)</text>
  <text x="80" y="322" class="s">• Reading order by XY-cut; background glow point</text>
  <text x="80" y="344" class="s">• Relation graph: concentric · centre/edge-aligned · near (bubbles) · page-centred ·</text>
  <text x="92" y="362" class="s">page-spanning bands · whether the content filled the page</text>
  <line x1="415" y1="382" x2="415" y2="404" class="ln" marker-end="url(#a)"/>

  <!-- 2 insight -->
  <rect x="60" y="406" width="710" height="78" rx="10" fill="#fff8ef" stroke="#c2552d" stroke-dasharray="6 5"/>
  <text x="80" y="432" class="t">2 · Insight</text>
  <text x="200" y="432" class="opt">OPTIONAL LLM · OFF BY DEFAULT</text>
  <text x="560" y="432" class="m">engine/insight.py</text>
  <text x="80" y="456" class="s">Model reviews the analysis + source render → validated JSON: role fixes, keep-together</text>
  <text x="80" y="474" class="s">pairs, fill-the-page intent, notes. Cached; any failure falls back to the analysis.</text>
  <line x1="415" y1="484" x2="415" y2="506" class="ln" marker-end="url(#a)"/>

  <!-- 3 layout -->
  <rect x="60" y="508" width="710" height="216" rx="10" fill="#eaf3ef" stroke="#8fb8a8"/>
  <text x="80" y="534" class="t">3 · Layout: 40–120 candidates</text>
  <text x="560" y="534" class="m">engine/layout.py</text>
  <g>
    <rect x="80" y="550" width="122" height="60" rx="8" fill="#fff" stroke="#8fb8a8"/>
    <text x="141" y="575" text-anchor="middle" class="s" font-weight="700">Scale-fit</text>
    <text x="141" y="594" text-anchor="middle" class="m">same shape → as is</text>
    <rect x="216" y="550" width="122" height="60" rx="8" fill="#fff" stroke="#8fb8a8"/>
    <text x="277" y="575" text-anchor="middle" class="s" font-weight="700">Stack</text>
    <text x="277" y="594" text-anchor="middle" class="m">one column</text>
    <rect x="352" y="550" width="122" height="60" rx="8" fill="#fff" stroke="#8fb8a8"/>
    <text x="413" y="575" text-anchor="middle" class="s" font-weight="700">Grid reflow</text>
    <text x="413" y="594" text-anchor="middle" class="m">2×2 → 4×1 …</text>
    <rect x="488" y="550" width="122" height="60" rx="8" fill="#fff" stroke="#8fb8a8"/>
    <text x="549" y="575" text-anchor="middle" class="s" font-weight="700">Split</text>
    <text x="549" y="594" text-anchor="middle" class="m">picture | text</text>
    <rect x="624" y="550" width="122" height="60" rx="8" fill="#fff" stroke="#8fb8a8"/>
    <text x="685" y="575" text-anchor="middle" class="s" font-weight="700">Banner</text>
    <text x="685" y="594" text-anchor="middle" class="m">one row strip</text>
  </g>
  <text x="80" y="636" class="s">Exact sizing: one shared type scale · text measured with the renderer's own font code ·</text>
  <text x="80" y="654" class="s">readability floors (never below a legible minimum) · images never stretch · panels hug content</text>
  <text x="80" y="680" class="s" font-weight="700">Snap pass on every candidate:</text>
  <text x="80" y="698" class="s">decorations follow their host or page edge · near-aligned items snap to one exact axis ·</text>
  <text x="80" y="716" class="s">page-centred items snap to centre · spanning bands span the target</text>
  <line x1="415" y1="724" x2="415" y2="746" class="ln" marker-end="url(#a)"/>

  <!-- 4 score -->
  <rect x="60" y="748" width="710" height="114" rx="10" fill="#f6ecea" stroke="#cf9d8f"/>
  <text x="80" y="774" class="t">4 · Score, keep the lowest energy</text>
  <text x="560" y="774" class="m">engine/energy.py · relations.py</text>
  <text x="80" y="798" class="s">New collisions · readability · hierarchy · use of canvas · balance · bare canvas · backdrop colour ·</text>
  <text x="80" y="816" class="s">relation fidelity (concentric, background glow, size proportions, dead zones, edge clearance,</text>
  <text x="80" y="834" class="s">crowding, headline line count) · plus a small prior so the source's own structure wins ties</text>
  <line x1="415" y1="862" x2="415" y2="884" class="ln" marker-end="url(#a)"/>

  <!-- 5 propose -->
  <rect x="60" y="886" width="710" height="96" rx="10" fill="#f1eef9" stroke="#a99bd0"/>
  <text x="80" y="912" class="t">5 · Propose: touch-up</text>
  <text x="560" y="912" class="m">engine/propose.py</text>
  <text x="80" y="936" class="s">Critic names defects with the units involved (collision, crowding, edge contact, misalignment)</text>
  <text x="80" y="954" class="s">→ typed edits (nudge, pull in, re-centre, shrink) → re-scored → kept only if the energy drops.</text>
  <text x="80" y="972" class="m">A model may choose among the same edits; it never writes coordinates.</text>
  <line x1="415" y1="982" x2="415" y2="1004" class="ln" marker-end="url(#a)"/>

  <!-- 6 finalize -->
  <rect x="60" y="1006" width="710" height="76" rx="10" fill="#eef1f6" stroke="#9aa6bd"/>
  <text x="80" y="1032" class="t">6 · Finalize</text>
  <text x="560" y="1032" class="m">engine/resize.py</text>
  <text x="80" y="1054" class="s">copy every element, change only geometry, font size and letter spacing · clamp in-canvas · keep</text>
  <text x="80" y="1072" class="s">image aspect · never raises: full engine → scale-fit → raw uniform scale with coerced numbers</text>
  <line x1="415" y1="1082" x2="415" y2="1104" class="ln" marker-end="url(#a)"/>
  <rect x="60" y="1106" width="710" height="40" rx="10" fill="#1f1b24"/>
  <text x="415" y="1132" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">Output JSON → official renderer (cr-renderer, offline) → PNG → scored</text>
  <text x="80" y="1180" class="m">Trace every step: python -m engine.trace input/*.json --out trace → navigable HTML per task</text>
  <text x="80" y="1200" class="m">(input · understanding overlay · insight · all candidates with score breakdown · touch-up · decision · geometry diff)</text>

  <!-- ===== dev-time column ===== -->
  <rect x="830" y="88" width="340" height="1135" rx="14" fill="#fbf4ec" stroke="#e2c9ae"/>
  <text x="850" y="114" class="tag" fill="#c2552d">DEV TIME · AI IN THE LOOP</text>

  <rect x="850" y="130" width="300" height="96" rx="10" fill="#fff" stroke="#e2c9ae"/>
  <text x="866" y="156" class="t">Research agents</text>
  <text x="866" y="178" class="s">papers, Canva/Express/Figma,</text>
  <text x="866" y="196" class="s">small models, solvers, saliency</text>
  <text x="866" y="214" class="s">→ HYPOTHESES.md (H0–H7)</text>

  <rect x="850" y="242" width="300" height="96" rx="10" fill="#fff" stroke="#e2c9ae"/>
  <text x="866" y="268" class="t">Test corpus + tests</text>
  <text x="866" y="290" class="s">25 designs (L1–L3) × 25 formats</text>
  <text x="866" y="308" class="s">59 contract, candidate, junk-</text>
  <text x="866" y="326" class="s">input and determinism tests</text>

  <rect x="850" y="354" width="300" height="172" rx="10" fill="#fff" stroke="#e2c9ae"/>
  <text x="866" y="380" class="t">Strict human-eye judges</text>
  <text x="866" y="402" class="s">Gemini + Claude see both renders</text>
  <text x="866" y="420" class="s">AND both JSONs; hard caps for</text>
  <text x="866" y="438" class="s">broken relations (detached shadow,</text>
  <text x="866" y="456" class="s">lost panel, off-centre logo)</text>
  <text x="866" y="482" class="s" font-weight="700">4.17 → 5.09 → 5.25</text>
  <text x="866" y="502" class="m">scale-fit → previous → current (of 7)</text>

  <rect x="850" y="542" width="300" height="80" rx="10" fill="#fff" stroke="#e2c9ae"/>
  <text x="866" y="568" class="t">Issues → general rules</text>
  <text x="866" y="590" class="s">clustered complaints became the</text>
  <text x="866" y="608" class="s">relation graph and snap pass</text>

  <rect x="850" y="638" width="300" height="250" rx="10" fill="#fff" stroke="#e2c9ae"/>
  <text x="866" y="664" class="t">Model experiments</text>
  <text x="866" y="688" class="s" font-weight="700">H4 LLM labels roles</text>
  <text x="866" y="706" class="s">4B 90.7% vs rules now 97.6%</text>
  <text x="866" y="724" class="s">→ rejected; wins ported to rules</text>
  <text x="866" y="750" class="s" font-weight="700">H5 VLM reranks top 3</text>
  <text x="866" y="768" class="s">+0.05 → rejected</text>
  <text x="866" y="794" class="s" font-weight="700">H7 LLM generates layouts</text>
  <text x="866" y="812" class="s">Gemini 4.20 / Qwen 2.83 vs</text>
  <text x="866" y="830" class="s">engine 5.33 → rejected</text>
  <text x="866" y="856" class="s" font-weight="700">Jev / Clef geometry, panels</text>
  <text x="866" y="874" class="s">see docs/AI_EXPERIMENTS.md</text>

  <rect x="850" y="904" width="300" height="80" rx="10" fill="#fff" stroke="#e2c9ae"/>
  <text x="866" y="930" class="t">Kept as optional steps</text>
  <text x="866" y="952" class="s">2 · Insight (LLM review)</text>
  <text x="866" y="970" class="s">5 · Propose (model may pick edits)</text>

  <!-- feedback arrows -->
  <path d="M850,470 C810,470 800,330 772,330" stroke="#c2552d" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#o)"/>
  <path d="M850,582 C812,582 806,690 772,690" stroke="#c2552d" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#o)"/>
  <path d="M850,600 C812,640 806,815 772,815" stroke="#c2552d" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#o)"/>
  <path d="M850,944 C812,944 806,445 772,445" stroke="#c2552d" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#o)"/>
  <text x="866" y="1020" class="m">Dashed orange arrows: findings that</text>
  <text x="866" y="1038" class="m">changed engine code. Nothing on this</text>
  <text x="866" y="1056" class="m">side runs in the scoring container.</text>
</svg>
